name: Release

# Every push to main is tested. When its Conventional Commit titles call for a release, semantic-release
# picks the version, and the tested package goes to the Marketplace, Open VSX and a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .github/release
      - id: plan
        env:
          RELEASE_PLAN_DIR: ${{ runner.temp }}/release-plan
        run: |
          git clone --quiet --bare . "$RUNNER_TEMP/origin.git"
          node .github/release/node_modules/semantic-release/bin/semantic-release.js --dry-run --repository-url "file://$RUNNER_TEMP/origin.git"
          if [ -f "$RELEASE_PLAN_DIR/version" ]; then
            version=$(cat "$RELEASE_PLAN_DIR/version")
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The planned version \"$version\" is not a plain release version."
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/notes.md
          if-no-files-found: error
          retention-days: 7

  ci:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  publish:
    name: Publish
    needs: [plan, ci]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    # The Azure identity that may publish trusts only this environment, which only main may use.
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Microsoft Entra ID through GitHub's OIDC token: no stored Marketplace secret.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # --skip-duplicate lets a rerun finish a release that stopped part way.
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4.0.0 publish --azure-credential --skip-duplicate --packagePath agent-guild.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OSVX_PAT }}
        run: npx --yes ovsx@1.3.0 publish --skip-duplicate agent-guild.vsix

  release:
    name: Tag and release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          cp "$RUNNER_TEMP/artifacts/vsix/agent-guild.vsix" "agent-guild-$VERSION.vsix"
          gh release create "$tag" "agent-guild-$VERSION.vsix" --target "$GITHUB_SHA" --title "$tag" \
            --notes-file "$RUNNER_TEMP/artifacts/release-plan/notes.md"
