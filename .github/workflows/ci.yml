name: CI

on:
  pull_request:
  # main runs it through the release workflow, which publishes only the package tested here.
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: inputs.version != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Changelog and version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            node .github/release/changelog.mjs CHANGELOG.md "$VERSION" "$RUNNER_TEMP/release-plan/notes.md"
            npm version "$VERSION" --no-git-tag-version
          else
            node .github/release/changelog.mjs CHANGELOG.md
          fi
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: agent-guild.vsix
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.os }}, VS Code ${{ matrix.vscode }}, ${{ matrix.manager }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: [stable]
        manager: [MIN_VERSION]
        include:
          # The oldest VS Code that package.json's engines admits.
          - os: ubuntu-latest
            vscode: 1.85.0
            manager: MIN_VERSION
          - os: ubuntu-latest
            vscode: stable
            manager: VIEW_VERSION
          - os: ubuntu-latest
            vscode: 1.85.0
            manager: VIEW_VERSION
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Install Agent Guild
        shell: bash
        env:
          MANAGER: ${{ matrix.manager }}
        run: npm install -g "@oddessentials/agent-guild@$(node -p "require('./src/manager')[process.env.MANAGER]")"
      - name: Start a test manager
        shell: bash
        run: |
          echo "AGENT_GUILD_HOME=$RUNNER_TEMP/agent-guild" >> "$GITHUB_ENV"
          AGENT_GUILD_HOME="$RUNNER_TEMP/agent-guild" AGENT_GUILD_PORT=47931 agent-guild --no-browser | grep -v 'token='
      - name: Open the tab from the installed package
        shell: bash
        env:
          VSIX: agent-guild.vsix
          VSCODE_VERSION: ${{ matrix.vscode }}
          EXPECT_VIEW: ${{ matrix.manager == 'VIEW_VERSION' && '1' || '' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e; else npm run test:e2e; fi

  required:
    name: Required checks
    if: always()
    needs: [package, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          PACKAGE: ${{ needs.package.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "Package: $PACKAGE, Test: $TEST"
          [ "$PACKAGE" = success ] && [ "$TEST" = success ]
