name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      # The oldest Agent Guild the extension accepts, as a user would install it.
      - name: Install the minimum Agent Guild
        shell: bash
        run: npm install -g "@oddessentials/agent-guild@$(node -p "require('./src/manager').MIN_VERSION")"
      - name: Start a test manager
        shell: bash
        run: |
          echo "AGENT_GUILD_HOME=$RUNNER_TEMP/agent-guild" >> "$GITHUB_ENV"
          AGENT_GUILD_HOME="$RUNNER_TEMP/agent-guild" AGENT_GUILD_PORT=47931 agent-guild --no-browser | grep -v 'token='
      - name: Open the tab in VS Code
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Open the tab in VS Code
        if: runner.os != 'Linux'
        run: npm run test:e2e
